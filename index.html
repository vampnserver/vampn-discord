<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>After Hours — Discord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero" id="top">
      <img class="background-media" src="assets/subway-background.gif" alt="" aria-hidden="true" />
      <section class="hero-copy"><a class="join-button" data-discord href="https://discord.gg/5hEnye5rg2" target="_blank" rel="noreferrer" aria-label="Join the Discord server">VAMPN</a><div class="server-count" aria-live="polite" aria-label="Discord server member status"><span class="member-total"><i class="status-dot members-dot" aria-hidden="true"></i><span id="member-count">—</span> MEMBERS</span><span><i class="status-dot online-dot" aria-hidden="true"></i><span id="online-count">—</span> ONLINE</span><span><i class="status-dot offline-dot" aria-hidden="true"></i><span id="offline-count">—</span> OFFLINE</span></div></section>
      <div class="music-player">
        <audio id="music" loop preload="metadata"></audio>
        <button class="music-toggle" id="music-toggle" type="button" disabled aria-label="Play music"><span aria-hidden="true">▶</span> MUSIC</button>
        <label class="music-file" for="music-file">ADD MP3</label>
        <input id="music-file" type="file" accept="audio/mpeg,audio/mp3" />
        <span class="music-title" id="music-title">NO TRACK SELECTED</span>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
